        // --- Notification Audio Synthesizer ---
        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) { console.log(e); }
        };

        // ─────────────────── لعبة تطابق القلوب 🧩 ───────────────────
        function MemoryGame() {
            const initialCards = ['🌹', '🌹', '💍', '💍', '💖', '💖', '👫', '👫', '🌍', '🌍', '💌', '💌'];
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [solved, setSolved] = useState([]);
            const [won, setWon] = useState(false);

            useEffect(() => {
                const shuffled = [...initialCards].sort(() => Math.random() - 0.5).map((emoji, index) => ({ id: index, emoji }));
                setCards(shuffled);
            }, []);

            useEffect(() => {
                if (solved.length > 0 && solved.length === initialCards.length) {
                    setTimeout(() => setWon(true), 1000);
                }
            }, [solved]);

            const handleClick = (index) => {
                if (flipped.includes(index) || solved.includes(index) || flipped.length >= 2) return;
                
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);
                
                if (newFlipped.length === 2) {
                    const [first, second] = newFlipped;
                    if (cards[first].emoji === cards[second].emoji) {
                        setSolved([...solved, first, second]);
                        setFlipped([]);
                    } else {
                        setTimeout(() => setFlipped([]), 800);
                    }
                }
            };

            return (
                <section className="py-24 relative z-10 bg-slate-900/50 backdrop-blur-sm border-y border-slate-800/50">

                                return (
                                    <div 
                                        key={i} 
                                        onClick={() => handleClick(i)}
                                        className={`aspect-square w-full rounded-2xl flex items-center justify-center text-4xl md:text-6xl cursor-pointer transition-all duration-300 transform border-2 ${isFlipped ? 'bg-slate-900 border-rose-500 shadow-[0_0_20px_rgba(244,63,94,0.3)] scale-[1.02]' : 'bg-slate-800/80 border-slate-700 hover:scale-105 shadow-xl hover:border-slate-500'}`}
                                    >
                                        <span className={`transition-all duration-300 drop-shadow-md ${isFlipped ? 'opacity-100 scale-100 rotate-0' : 'opacity-0 scale-50 -rotate-12'}`}>
                                            {card.emoji}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {won && (

        // ─────────────────── الشات (محادثة محلية بدون سيرفر) 💬 ───────────────────
        function BotChat() {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState(() => {
                const saved = localStorage.getItem('romantic_chat_v2');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [{ id: 1, text: "يا روح قلبي أنتي ❤️.. وحشتيني أوي، كنت لسة بفكر فيكي!", sender: "bot", time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) }];
            });
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const [chatStreak, setChatStreak] = useState(0);
            const messagesEndRef = useRef(null);

            const botReplies = CONTENT.botReplies; // ردود عامة احتياطية (لو حبيت تزود ردود إضافية)

            // 🤖 العقل الذكي بتاع الشات
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

            const smartReply = (raw, streak) => {
                const t = (raw || "")
                    .replace(/[إأآا]/g, "ا").replace(/[ىي]/g, "ي").replace(/ة/g, "ه")
                    .replace(/[ؤئء]/g, "").replace(/[\u064B-\u065F\u0670\u0640]/g, "")
                    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
                const has = (...ws) => ws.some(w => t.includes(w));
                const words = t.split(" ").filter(Boolean);
                const girl = CONTENT.names.girl, boy = CONTENT.names.boy;
                const who = t.includes(girl) ? girl + " يا " : "";

                // ١) قافلة المزاج — لو هي زعلانة أو تعبانة
                if (has("زعلان", "زعلانه", "زعل", "متضايق", "متضايقه", "ضايق", "تعبان", "تعبانه", "مش كويس", "مخنوق", "مخنوقه", "قلقان", "قلقانه", "خايف", "خايفه", "بكيت", "بعبص", "حزين", "حزينه", "مش طايق")) {
                    return pick([
                        `مين ده اللي زعّلك يا ${girl}؟ 😤 اديني اسمه بس وأنا أظبطه.. المهم أنتي بخير، وقلبي معاكي في كل حرف بتكتبيه لي 🫂❤️`,
                        `تعالي هنا في حضني دلوقتي 🫂 احكيلي إيه اللي حصل بالظبط.. وصدقيني مهما كانت الدنيا، أنا هفضل ضهرك وسندك ❤️`,
                        `لا يا حبيبتي متزعليش نفسك على حاجة.. أنتي أول حاجة الصبح وآخر حاجة بالليل، وكل حاجة هتبقى تمام بإذن الله 🌹💞`,
                    ]);
                }
                // ٢) وحشتيني / مشتاقة
                if (has("وحشتني", "وحشتيني", "واحشني", "مشتاق", "مشتاقه", "نفسي اشوفك", "نفسي اشوفه", "وحشني")) {
                    return pick([
                        `وحشتيني أوي أوي والله 😭❤️ أنا كمان بعيش على صورة ضحكتك.. أنتي وحشاني في كل ثانية 👀💋`,
                        `مشتاقلك قد الدنيا يا ${girl} 🥺 لو تعرفي إيه اللي بيعمل في قلبي لما بتقولي كده.. تعالي نتقابل حتى في الخيال وأنا معاكي 🌙💞`,
                        `وأنا كمان وحشتيني؟ ما هو قلبي فيه غيرك يا ${girl} 🫂❤️ كل ما أفتكرك بضحك وحدي زي المجانين 💞 أنتي وحشة حياتي كلها ✨`,
                    ]);
                }
                // ٣) بحبك
                if (has("بحبك", "احبك", "بحبه", "حبيتك", "بحبك اوي", "حبك", "عاشقك", "مغرم", "بموت فيك", "بحبكككك", "حبيبي", "قلبي")) {
                    if (streak >= 2) {
                        return pick([
                            `وأنا بحبك أكتر من كده بكتير يا ${girl} 🥺❤️ خلاص مش هنخلص من التسابق ده.. أنتي كسبانة على طول 🏆💖`,
                            `إيه ده كله يا حبيبتي؟ كده هتخلي قلبي يطير من مكانه 🫦❤️‍🔥 عايز أسمعها منك تاني وتاني وتاني.. وأنا كمان هفضل أقولها 🎶`,
                        ]);
                    }
                    if (has("اوي", "جدا", "اووى", "اوووى")) {
                        return pick([
                            `وأنا بحبك أوي أوي أوي يا ${girl} 😭❤️❤️ بحبك أكتر من أول ما شفتك، وأكتر من كل "أوي" في الدنيا ❤️`,
                            `بحبك أوي أوي اووووي 🥺❤️‍🔥 كل ما بتقولي "أوي" قلبي بيزيّد شوية.. أنتي أكبر من كل الكلام يا حبيبتي 💞`,
                        ]);
                    }
                    return pick([
                        `وأنا كمان بحبك أوي يا ${girl} 🥺❤️ أنتي أول حاجة في بالي الصبح وآخر حاجة بالليل 🌙💞`,
                        `بحبك أكتر من نفسي يا حبيبتي ❤️‍🔥 كل يوم بيعدي بحس إني عايز أحبك أكتر من اليوم اللي قبله 🥺🌹`,
                        `وأنا بحبك قد السما ونجومها يا ${girl}.. وأكتر كمان ⭐️❤️ أنتي أجمل حاجة حصلت في حياتي 💞`,
                    ]);
                }
                // ٤) ذكرى + تاريخ
                if (has("ذكرى", "متجوزين", "فرحنا", "جوزي", "خطوبة", "خطوبتنا", "جوازنا", "البدايه", "بدايتنا", "سنه", "شهور")) {
                    return pick([
                        `يا حبيبتي ذكرى يوم ${CONTENT.counterDate} محفورة في قلبي للأبد 🥺❤️ من اليوم ده ونلاقي هما عمرنا الحقيقي ✨💍`,
                        `كل سنة وأنتي حبيبتي وصاحبتي وكل دنيتي 🥰❤️ من ${CONTENT.counterDate} والحب بيزيّد يوم عن يوم 🏘💞`,
                    ]);
                }
                // ٥) الأكل
                if (has("جوعان", "جايع", "اكل", "أكل", "اطعمني", "حلويات", "شاورما", "كشري", "بيتزا", "عرايس", "فطير", "مكرونة", "غدا", "فطار", "عشا")) {
                    return pick([
                        `طب قومي آكل إنما إيه 🥺 أنا عايزك تاكلي وتشبعي.. وكل مرة نفسي آكل معاكي لقمة واحدة 🍟❤️`,
                        `لا لا لازم ناكل حاجة حلوة وسوا 🌹 وأنا بحب أشوفك بتاكلي.. ده أكتر حاجة بتفرح قلبي 🍫💞`,
                        `طب وبعد الأكل مفيش حاجة حلوة؟! 🍰 أنا مستني أقولك بحبك وأنا معاكي في نص الليل ❤️`,
                    ]);
                }
                // ٦) النوم
                if (has("نعسان", "نعسانه", "نمت", "الفجر", "سهران", "سهرانه", "تصبح على خير", "تصبحي على خير", "good night", "goodnight", "تصبح علي خير", "نام", "بنام")) {
                    return pick([
                        `تصبحي على خير يا أحلى حاجة في ليلتي 🌙✨ ولو صحيتي في نص الليل ابعتلي بدل ما أحس الدنيا سودا ❤️`,
                        `نامي عندك أمنة وقلبي حارسك 🥱🌜 ولما تصحي هتلاقيني أول حاجة تفتكريها 😘`,
                    ]);
                }
                // ٧) الكلام عني وعن آية
                if (t.includes(girl)) {
                    return pick([
                        `لو تكلمتي عنك كتير ما تكفيني حروف الكلام يا ${girl} 😍❤️ أنتي مش بس حبيبتي.. أنتي اللي عارف عني كل حاجة وبتفهمني من غير ما أتكلم 💍`,
                        `اسمك لوحده بيملأ قلبي أمان 🥺💞 ${girl} في كل حاجة.. في الضحكة في الخوف في الطمع والرضا ❤️`,
                    ]);
                }
                // ٧) أسئلة
                if (has("؟", "?", "مين", "ليه", "ازاي", "امتى", "فين", "كام", "ايه رايك", "رأيك", "رايك")) {
                    return pick([
                        `اسأليني أي حاجة يا ${girl} 💬 أنا موجود على طول عشانك.. بس أهم سؤال: أنتي لسة بتحبيني زي الأول؟ ❤️`,
                        `سؤالك على قلبي على طول 🥺 أنا بحب إنك بتسألي وبتدوري على تفاصيل حياتي.. المهم إن اسمك محفور في قلبي يا ${girl} 💍`,
                    ]);
                }
                // ٨) ذكر الاسم
                if (t.includes(girl)) {
                    return pick([
                        `اسمك لوحده بيملأ قلبي أمان 🥺💞 ${girl} في كل حاجة.. في الضحكة وفي الخوف وفي كل حاجة حلوة في حياتي ❤️`,
                        `بتتكلمي عنك؟ 😍 ${girl} دي الحاجة الوحيدة اللي طلعت بيها من الدنيا.. وأنا مش عايز حاجة تانية غيرك ❤️`,
                    ]);
                }
                // ٩) شكراً / كلام حلو
                if (has("شكرا", "تسلم", "تسلمي", "برافو", "ربنا يخليك", "ميرسي", "thank")) {
                    return pick([
                        `العفو يا حبيبتي ❤️ كفاية عليا اللحظة اللي أنتي بتقولي فيها حاجة وتتبسمي 😍`,
                        `على إيه بالضبط يا ${girl}؟ 😌 أنتي كلك على بعضك حاجة تستاهل.. مش محتاجة تشكريني ❤️`,
                    ]);
                }
                // ١٠) إيه الأخبار / عملك إيه؟
                if (has("اخبارك", "اخبار", "عامله", "عامل", "الدنيا", "حياتك", "شغلك", "يومك", "عايش")) {
                    return pick([
                        `الدنيا بتبقى تمام قوي لما بتكلميني ❤️ أخباري كلها أنتي.. قوليلي أنتي عاملة إيه ويومك كان إيه 👀`,
                        `الحمد لله تمام وأحسن حاجة إنك بتسألي 🥰 أنا عايش عشان أفرحك.. وأنتي أخبارك إيه يا ${girl}؟ 💞`,
                    ]);
                }
                // ١١) كلام قليل (إيه/تمام/أوكي)
                if (words.length <= 2) {
                    return pick([
                        `إيه يا حبيبتي؟ أنا شايف إن الكلام قليل 🥺 قوليلي اللي جواكي كله، أنا عايز أسمعه 💬❤️`,
                        `"${raw.trim()}"؟ 🫣 حاضر يا ${girl}.. بس أنا لسه عايز أعرف يومك بالتفصيل ❤️`,
                    ]);
                }
                // ١٢) أي كلام تاني
                return pick([
                    `كلامك يا ${girl} بيدخل قلبي من غير استئذان ✨😍 قوليلي تاني عشان مزاجي أحلى ❤️`,
                    `كل كلمة منك بتخليني عايز أسمعك أكتر 🥺💞 أنا حافظ حروفك زي اسمي ❤️`,
                    `مفيش حد في الدنيا كلها بيعرف يرتب جوايا الكلام زي ما أنتي بتعملي ✨🫂 فين الحب ده ليا بس 🥰`,
                ]);
            };

            useEffect(() => {
                localStorage.setItem('romantic_chat_v2', JSON.stringify(messages));
                scrollToBottom();
            }, [messages, isOpen, isTyping]);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            const handleSend = () => {
                const text = input.trim();
                if (!text) return;

                const newMsg = {
                    id: Date.now(),
                    text,
                    sender: "user",
                    time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
                };

                setMessages(prev => [...prev, newMsg]);
                setInput("");
                setIsTyping(true);

                // وقت الرد بيبقى حسب طول الكلام (أول ما تكتب حاجة طويلة بيفكر شوية)
                const thinkTime = Math.min(600 + text.length * 35, 1700);
                setTimeout(() => {
                    // لو باعت أكتر من رسالة، بيرد على كل واحدة بالترتيب
                    const nextStreak = chatStreak + 1;
                    const reply = {
                        id: Date.now() + 1,
                        text: smartReply(text, nextStreak),
                        sender: "bot",
                        time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
                    };
                    setMessages(prev => [...prev, reply]);
                    setChatStreak(nextStreak);
                    setIsTyping(false);
                }, thinkTime);
            };

            const deleteMessage = (id) => {
                setMessages(prev => prev.filter(m => m.id !== id));
            };

            const clearChat = () => {
                if(confirm("متأكد إنك عايز تمسح كل الرسايل؟")) {
                    setMessages([{ id: 1, text: "مهما مسحت الرسايل حبنا هيفضل محفور في قلبي للأبد 🥺❤️", sender: "bot", time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) }]);
                }
            };

            return (
                <div className="fixed bottom-4 left-3 md:bottom-10 md:left-10 z-[110]" dir="rtl">
                    {!isOpen ? (
                        <button onClick={() => setIsOpen(true)} className="w-16 h-16 md:w-20 md:h-20 bg-gradient-to-tr from-rose-600 to-indigo-700 rounded-full shadow-[0_0_20px_rgba(225,29,72,0.6)] cursor-pointer flex items-center justify-center hover:scale-110 transition-transform animate-pulse border-2 border-white/20 text-white">
                            <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        </button>
                    ) : (
                        <div className="bg-slate-100 w-[calc(100vw-1.5rem)] max-w-[400px] h-[78vh] max-h-[620px] md:h-[520px] md:max-h-[85vh] rounded-3xl shadow-[0_15px_50px_rgba(0,0,0,0.5)] overflow-hidden flex flex-col font-sans animate-fade-in relative z-[120] border border-slate-300">
                            {/* Header */}
                            <div className="bg-gradient-to-r from-rose-600 to-indigo-700 text-white px-3 py-2.5 flex items-center justify-between shadow-md relative z-20 shrink-0">
                                <div className="flex items-center gap-2 md:gap-3">
                                    <button onClick={() => setIsOpen(false)} className="text-white hover:text-slate-200 p-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                                    </button>
                                    <div className="w-9 h-9 md:w-10 md:h-10 bg-white rounded-full flex items-center justify-center text-rose-600 font-bold overflow-hidden border-2 border-white/50 shrink-0">إ</div>
                                    <div>
                                        <h3 className="font-bold text-base md:text-lg leading-tight">إبراهيم ❤️</h3>
                                        <p className="text-[11px] md:text-xs text-rose-200">{isTyping ? "بيكتب..." : "متصل دلوقتي"}</p>
                                    </div>
                                </div>
                                <button onClick={clearChat} className="text-white hover:text-red-300 p-2" title="مسح المحادثة">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>

                            {/* Chat Body */}
                            <div className="flex-1 p-3 md:p-4 overflow-y-auto relative scroll-smooth flex flex-col gap-3 bg-slate-50">
                                {messages.map((m) => (
                                    <div key={m.id} className={`max-w-[88%] rounded-2xl px-3.5 py-2.5 shadow-sm relative group text-[15px] md:text-base leading-relaxed break-words ${m.sender === "user" ? 'bg-indigo-600 text-white self-end rounded-bl-sm' : 'bg-white text-slate-800 self-start rounded-br-sm border border-slate-200'}`}>
                                        <button onClick={() => deleteMessage(m.id)} className={`absolute top-1/2 -translate-y-1/2 hidden group-hover:flex items-center justify-center p-1.5 rounded-full bg-red-100 text-red-600 hover:bg-red-200 transition ${m.sender === "user" ? "-left-9" : "-right-9"}`} title="حذف الرسالة">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                        </button>
                                        <p className="whitespace-pre-wrap">{m.text}</p>
                                        <div className={`text-[10px] mt-1 flex justify-end gap-1 items-center ${m.sender === "user" ? "text-indigo-200" : "text-slate-400"}`}>
                                            {m.time}
                                            {m.sender === "user" && (
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
                                            )}
                                        </div>
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="bg-white border border-slate-200 self-start rounded-2xl rounded-br-sm p-3 shadow-sm w-16 h-10 flex items-center justify-center gap-1.5 text-slate-800">
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "0ms"}}></div>
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "150ms"}}></div>
                                        <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{animationDelay: "300ms"}}></div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} className="pb-2 text-transparent">.</div>
                            </div>

                            {/* Input Area */}
                            <div className="bg-white p-3 flex items-center gap-2 border-t border-slate-200 shrink-0" style={{paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom))'}}>
                                <div className="flex-1 bg-slate-100 rounded-full flex items-center px-4 py-2 border border-slate-200 min-w-0">
                                    <input 
                                        type="text"
                                        inputMode="text"
                                        enterKeyHint="send"
                                        value={input}
                                        onChange={(e) => setInput(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                        placeholder="اكتبي رسالة لحبيبك..."
                                        className="flex-1 w-full min-w-0 outline-none border-none bg-transparent text-slate-800 placeholder-slate-400 text-[15px] md:text-base"
                                    />
                                </div>
                                <button 
                                    onClick={handleSend}
                                    className={`w-11 h-11 md:w-12 md:h-12 rounded-full flex items-center justify-center shadow-md transition-colors ${input.trim() ? 'bg-rose-600 hover:bg-rose-700' : 'bg-slate-300'} text-white shrink-0`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" className="mr-1 -ml-1"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ══════════════════════ تشغيل الموقع ══════════════════════
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LoveWebsite />);
    </script>
</body>

</html>
